services:
  - type: web
    name: thinbi-instagram-agent
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_USER_ID
        value: thinbi-instagram-owner
      - key: COMPOSIO_INSTAGRAM_AUTH_CONFIG_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_BUSINESS_APP_ID
        sync: false
      - key: META_BUSINESS_APP_SECRET
        sync: false
      - key: META_BUSINESS_CONFIG_ID
        sync: false
      - key: META_BUSINESS_REDIRECT_URI
        value: https://thinbi-agent.onrender.com/auth/meta/callback
      - key: META_APP_SECRET
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v26.0
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: INSTAGRAM_AUTO_DMS_ENABLED
        value: "false"
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: qwen2.5:1.5b
      - key: DATA_DIR
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
